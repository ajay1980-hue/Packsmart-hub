name: Packsmart Google SEO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google-seo.yml"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  seo-check:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://packsmartsolutions.com/
      SITEMAP_URL: https://packsmartsolutions.com/sitemap.xml
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check sitemap and priority pages
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            "https://packsmartsolutions.com/"
            "https://packsmartsolutions.com/collections/bubble-pouches"
            "https://packsmartsolutions.com/collections/bubble-envelopes"
            "https://packsmartsolutions.com/collections/mailing-bags"
          )

          storefront_locked=false
          for url in "${pages[@]}"; do
            result=$(curl --fail-with-body -L -sS -o /dev/null \
              -w "%{http_code} %{url_effective}" "$url")
            read -r code effective_url <<< "$result"
            echo "$code $url -> $effective_url"

            if [[ "$effective_url" == *"/password"* ]]; then
              storefront_locked=true
              continue
            fi

            test "$code" -ge 200 -a "$code" -lt 400
          done

          sitemap_code=$(curl -L -sS -o /dev/null -w "%{http_code}" "$SITEMAP_URL")
          echo "$sitemap_code $SITEMAP_URL"

          if $storefront_locked; then
            echo "::warning::The Shopify storefront is password-protected. Priority pages redirect to /password and Shopify does not expose sitemap.xml until the store is public."
            test "$sitemap_code" = "404" -o "$sitemap_code" = "200"
          else
            test "$sitemap_code" -ge 200 -a "$sitemap_code" -lt 400
          fi

      - name: Set up Python
        if: env.GSC_SERVICE_ACCOUNT_JSON != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API libraries
        if: env.GSC_SERVICE_ACCOUNT_JSON != ''
        run: pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Submit sitemap to Google Search Console
        if: env.GSC_SERVICE_ACCOUNT_JSON != ''
        shell: python
        run: |
          import json, os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          site_url = "https://packsmartsolutions.com/"
          sitemap_url = "https://packsmartsolutions.com/sitemap.xml"
          info = json.loads(os.environ["GSC_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/webmasters"],
          )
          service = build("searchconsole", "v1", credentials=creds, cache_discovery=False)
          service.sitemaps().submit(siteUrl=site_url, feedpath=sitemap_url).execute()
          print(f"Submitted {sitemap_url} for {site_url}")

      - name: Google credential not configured
        if: env.GSC_SERVICE_ACCOUNT_JSON == ''
        run: |
          echo "::notice::SEO URL checks passed. Add repository secret GSC_SERVICE_ACCOUNT_JSON to enable automatic sitemap submission to Google Search Console."
          echo "::notice::Google does not offer a general-purpose API to request indexing for ordinary Shopify pages; use Search Console URL Inspection for the four priority URLs."
