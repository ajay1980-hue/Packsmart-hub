name: Business outcome PostgreSQL publication
on:
  pull_request:
    paths:
      - 'saas/server/**'
      - '.github/workflows/business-outcome-check.yml'
  push:
    paths:
      - 'saas/server/**'
      - '.github/workflows/business-outcome-check.yml'
permissions:
  contents: read
jobs:
  postgres-business-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: runvara_outcome_test
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d runvara_outcome_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OUTCOME_TEST_DATABASE_URL: postgres://postgres:disposable-test-password@127.0.0.1:5432/runvara_outcome_test
      OUTCOME_ALLOW_DISPOSABLE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: saas/server/tests/atomic-usage/package-lock.json
      - name: Install locked test-only PostgreSQL driver
        run: npm --prefix saas/server/tests/atomic-usage ci --ignore-scripts --no-audit --no-fund
      - name: Verify content identity through real JSONB before applying the fixture schema
        env:
          CONTENT_JSONB_DISPOSABLE_FIXTURE: github-actions-postgres17
        run: node --test --test-concurrency=1 saas/server/tests/content-jsonb-postgres.mjs
      - name: Verify actual concurrent publication and privilege boundaries
        run: node --test --test-concurrency=1 saas/server/tests/business-outcome-postgres.mjs
      - name: Verify protected content receipts, capacity and rollback boundaries
        run: node --test --test-concurrency=1 saas/server/tests/content-execution-receipt-postgres.mjs
      - name: Verify receipt-backed outcome review and publication
        run: node --test --test-concurrency=1 saas/server/tests/receipt-outcome-consumer-postgres.mjs
      - name: Verify bounded Shopify order recovery and cleanup
        run: node --test --test-concurrency=1 saas/server/tests/shopify-order-recovery-postgres.mjs
      - name: Verify recovery importer through the real storage adapter
        run: node --test --test-concurrency=1 saas/server/tests/shopify-order-recovery-transport-postgres.mjs
      - name: Verify staged readers, publication reconciliation and admitted receipt completion
        env:
          STAGED_READER_DISPOSABLE_FIXTURE: github-actions-postgres17
        run: node --test --test-concurrency=1 saas/server/tests/staged-reader-postgres.mjs
      - name: Verify the pinned official PostgREST test binary
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$RUNNER_TEMP/runvara-postgrest-tools"
          mkdir -p "$test_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 60 \
            --output "$test_dir/postgrest.tar.xz" \
            https://github.com/PostgREST/postgrest/releases/download/v14.5/postgrest-v14.5-linux-static-x86-64.tar.xz
          echo 'ab5cc7e974d4940447991804588cfb8b3f7b2c57b691f0905df04d51ede69470  '"$test_dir/postgrest.tar.xz" | sha256sum --check --strict
          test "$(tar -tJf "$test_dir/postgrest.tar.xz")" = postgrest
          tar -xJf "$test_dir/postgrest.tar.xz" --directory "$test_dir" --no-same-owner --no-same-permissions postgrest
          echo '39ce04b0597c6b3c3eb4c5f34fe6ab590a2d0172616eeaccf1e4c659b822295a  '"$test_dir/postgrest" | sha256sum --check --strict
          chmod 700 "$test_dir/postgrest"
          test "$("$test_dir/postgrest" --version)" = 'PostgREST 14.5'
      - name: Qualify staged readers through actual local PostgREST HTTP
        env:
          STAGED_READER_DISPOSABLE_FIXTURE: github-actions-postgres17
          STAGED_READER_POSTGREST_BIN: ${{ runner.temp }}/runvara-postgrest-tools/postgrest
          STAGED_READER_EVIDENCE_DIR: ${{ runner.temp }}/runvara-postgrest-evidence
        run: node --test --test-concurrency=1 saas/server/tests/staged-reader-postgrest.mjs
