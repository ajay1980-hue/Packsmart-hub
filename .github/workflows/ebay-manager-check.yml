name: eBay Manager Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ebay-manager/**"
      - ".github/workflows/ebay-manager-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate manager JavaScript
        run: node --check ebay-manager/app.js

      - name: Validate multi-photo build
        shell: bash
        run: |
          grep -q 'type="file" accept="image/\*" multiple' ebay-manager/index.html
          grep -q 'MAX_PHOTOS = 24' ebay-manager/app.js
          grep -q 'makeMain' ebay-manager/app.js
          grep -q 'movePhoto' ebay-manager/app.js
          grep -q 'photoOrder' ebay-manager/app.js
          echo "Multi-photo UI checks passed"

      - name: Validate authenticated Shopify catalogue snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ebay-manager/shopify-products.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          products = data.get("products", [])
          if len(products) != 15:
              raise SystemExit(f"Expected 15 synced Packsmart products, got {len(products)}")

          required = {"id", "handle", "title", "variants"}
          for product in products:
              missing = required - product.keys()
              if missing:
                  raise SystemExit(f"{product.get('title', 'Unknown product')} missing {sorted(missing)}")
              if not product["variants"]:
                  raise SystemExit(f"{product['title']} has no variants")
              for variant in product["variants"]:
                  for field in ("title", "price", "sku"):
                      if field not in variant:
                          raise SystemExit(f"{product['title']} variant missing {field}")

          print(f"Authenticated Shopify snapshot valid: {len(products)} products")
          PY

      - name: Probe public Shopify feed
        continue-on-error: true
        shell: bash
        run: |
          code=$(curl -LsS -o /tmp/products.json -w "%{http_code}"             'https://packsmartsolutions.com/products.json?limit=250')
          echo "Public Shopify feed HTTP $code"
          if [ "$code" = "200" ]; then
            echo "::notice::Public Shopify feed is live; the manager will prefer live catalogue data."
          else
            echo "::notice::Public Shopify feed is unavailable (HTTP $code); the manager will automatically use the authenticated synced catalogue."
          fi
