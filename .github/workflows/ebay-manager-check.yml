name: eBay Manager Check

on:
  workflow_dispatch:
  push:
    branches: [main, finish-ebay-manager]
    paths:
      - "ebay-manager/**"
      - ".github/workflows/ebay-manager-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate manager JavaScript
        run: |
          node --check ebay-manager/core.js
          node --check ebay-manager/backend.js
          node --check ebay-manager/app.js

      - name: Run eBay Manager behaviour tests
        run: node ebay-manager/tests/ebay-manager.test.js

      - name: Validate upload, postage and live-listing build
        shell: bash
        run: |
          grep -q 'id="photoInput" type="file"' ebay-manager/index.html
          grep -q 'id="labelInput" type="file" accept="application/pdf,image/\*,.pdf"' ebay-manager/index.html
          grep -q 'name="postageMode" value="free"' ebay-manager/index.html
          grep -q 'name="postageMode" value="paid"' ebay-manager/index.html
          grep -q 'packsmartsolutions20' ebay-manager/index.html
          grep -q 'MAX_PHOTOS = 24' ebay-manager/core.js
          grep -q 'MAX_PHOTO_BYTES = 12' ebay-manager/core.js
          grep -q 'makeMain' ebay-manager/core.js
          grep -q 'movePhoto' ebay-manager/core.js
          grep -q 'validatePhotoFile' ebay-manager/core.js
          grep -q 'validateLabelFile' ebay-manager/core.js
          grep -q 'normalizePostage' ebay-manager/core.js
          grep -q 'photoOrder' ebay-manager/core.js
          grep -q 'id="saveDraft"' ebay-manager/index.html
          grep -q 'id="createListing"' ebay-manager/index.html
          grep -q 'backend.createListing' ebay-manager/app.js
          grep -q "form.append('photos'" ebay-manager/backend.js
          grep -q "form.append('postage'" ebay-manager/backend.js
          grep -q "form.append('ebayAccount'" ebay-manager/backend.js
          echo "Photo, label, postage, draft and live-listing UI checks passed"

      - name: Validate authenticated Shopify catalogue snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ebay-manager/shopify-products.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          products = data.get("products", [])
          if len(products) != 15:
              raise SystemExit(f"Expected 15 synced Packsmart products, got {len(products)}")

          required = {"id", "handle", "title", "variants"}
          for product in products:
              missing = required - product.keys()
              if missing:
                  raise SystemExit(f"{product.get('title', 'Unknown product')} missing {sorted(missing)}")
              if not product["variants"]:
                  raise SystemExit(f"{product['title']} has no variants")
              for variant in product["variants"]:
                  for field in ("title", "price", "sku"):
                      if field not in variant:
                          raise SystemExit(f"{product['title']} variant missing {field}")

          print(f"Authenticated Shopify snapshot valid: {len(products)} products")
          PY

      - name: Probe public Shopify feed
        continue-on-error: true
        shell: bash
        run: |
          code=$(curl -LsS -o /tmp/products.json -w "%{http_code}" \
            'https://packsmartsolutions.com/products.json?limit=250')
          echo "Public Shopify feed HTTP $code"
          if [ "$code" = "200" ]; then
            echo "::notice::Public Shopify feed is live; the manager will prefer live catalogue data."
          else
            echo "::notice::Public Shopify feed is unavailable (HTTP $code); the manager will automatically use the synced catalogue."
          fi
