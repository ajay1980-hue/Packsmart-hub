name: Packsmart SaaS checks

on:
  push:
    paths:
      - 'saas/**'
      - 'ebay-manager/shopify-products.json'
      - '.github/workflows/saas-check.yml'
  pull_request:
    paths:
      - 'saas/**'
      - 'ebay-manager/shopify-products.json'
      - '.github/workflows/saas-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm --prefix saas/server ci --ignore-scripts
      - name: Browser syntax check
        run: node --check saas/app.js
      - name: Server syntax check
        run: npm --prefix saas/server run check
      - name: Phase 1 safety and integration guards
        run: node saas/tests/saas-guard.test.cjs
      - name: Fetch pinned pre-annotation reader for compatibility tests
        run: |
          git fetch --no-tags --depth=1 origin 601deebcc5c3fb86cd81bee85121368ff2643f05
          test "$(git rev-parse 601deebcc5c3fb86cd81bee85121368ff2643f05^{tree})" = 846d356fe85f1689b8361fbb46ddf09f997dbc33
      - name: Phase 2 security and tenancy tests
        run: npm --prefix saas/server test
        env:
          RUNVARA_QUIET_PROCESS_EVIDENCE_DIR: /tmp/runvara-quiet-process
      - name: Verify pinned predecessor and quiet process cutover
        run: |
          git fetch --no-tags --depth=1 origin d32da62d0e7935597638266d44d88ae5e066d51f
          node --test saas/server/tests/quiet-startup-process-d32.mjs
        env:
          RUNVARA_D32_SOURCE_DIR: ${{ github.workspace }}
          RUNVARA_QUIET_PROCESS_EVIDENCE_DIR: /tmp/runvara-quiet-process
      - name: Install browser for mobile layout checks
        run: cd saas/server && npx playwright install --with-deps chromium
      - name: Verify customer onboarding on mobile and desktop
        run: |
          node saas/server/tests/render-connection-preview.mjs /tmp/runvara-mobile-preview.html
          node saas/server/tests/mobile-connection-check.mjs /tmp/runvara-mobile-preview.html
      - name: Verify business graph and objectives on mobile and desktop
        run: node saas/server/tests/business-graph-browser-check.mjs
      - name: Verify governed usage on mobile and desktop
        run: node saas/server/tests/provider-usage-browser-check.mjs
      - name: Verify legacy usage completeness on mobile and desktop
        run: node saas/server/tests/legacy-ai-usage-browser-check.mjs
      - name: Verify objective preparation on mobile and desktop
        run: node saas/server/tests/objective-review-browser-check.mjs
      - name: Verify exact manual content preparation on mobile and desktop
        run: node saas/server/tests/manual-content-browser-check.mjs
      - name: Verify objective-bound content preparation on mobile and desktop
        run: node saas/server/tests/objective-content-browser-check.mjs
      - name: Verify archived automation history on mobile and desktop
        run: node saas/server/tests/automation-history-browser-check.mjs
      - name: Verify owner outcome review on mobile and desktop
        run: node saas/server/tests/business-outcomes-browser-check.mjs
      - name: Verify protected content sources in outcome review
        run: node saas/server/tests/business-outcomes-receipt-browser-check.mjs
      - name: Verify optional Shopify order recovery
        run: node saas/server/tests/order-recovery-browser-check.mjs
      - name: Verify workspace activity on mobile and desktop
        run: node saas/server/tests/activity-browser-check.mjs
      - name: Verify imported order evidence on mobile and desktop
        run: node saas/server/tests/imported-order-evidence-browser-check.mjs
      - name: Verify retained SEO visibility review
        run: node saas/server/tests/seo-review-browser-check.mjs
      - name: Verify closed-stage feedback and retained uncertainty
        run: node saas/server/tests/governed-paused-browser-check.mjs
      - name: Verify quiet startup feedback and manual reload
        run: node saas/server/tests/quiet-startup-browser-check.mjs
      - name: Verify saved brief history and authenticated recovery
        run: node saas/server/tests/brief-history-browser-check.mjs
      - name: Verify cost source review and retained uncertainty
        run: node saas/server/tests/cost-source-browser-check.mjs
      - name: Upload cost source 320px review qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runvara-cost-source-320-review
          path: /tmp/runvara-cost-source/320/review/
          if-no-files-found: warn
      - name: Upload cost source 320px reconciliation qualification
