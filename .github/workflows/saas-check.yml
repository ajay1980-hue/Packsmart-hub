          if-no-files-found: ignore
      - name: Build production container
        run: docker build -f saas/server/Dockerfile -t packsmart-ops:test .
      - name: Boot container and smoke-test health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name packsmart-ops-test -p 8787:8787 \
            -e NODE_ENV=test \
            -e PACKSMART_ADMIN_EMAIL=sales@packsmartsolutions.com \
            -e PACKSMART_ADMIN_PASSWORD='Packsmart-Test-Only!2026' \
            -e SESSION_SECRET='test-session-secret-with-more-than-thirty-two-characters' \
            -e CREDENTIALS_KEY='test-credential-key-with-more-than-thirty-two-characters' \
            packsmart-ops:test
          trap 'docker rm -f packsmart-ops-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health | grep -q '"authentication":true'; then
              exit 0
            fi
            sleep 1
          done
          docker logs packsmart-ops-test
          exit 1
      - name: Upload Shopify recovery 320px verification images
        if: always()
