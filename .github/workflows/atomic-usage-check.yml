name: Atomic provider usage PostgreSQL

on:
  pull_request:
    paths:
      - 'saas/server/**'
      - 'saas/docs/operator-brief-admission-timeout.md'
      - '.github/workflows/atomic-usage-check.yml'
  push:
    paths:
      - 'saas/server/**'
      - 'saas/docs/operator-brief-admission-timeout.md'
      - '.github/workflows/atomic-usage-check.yml'

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: runvara_atomic_usage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runvara_atomic_usage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Deliberately fixed localhost database. No repository or production secrets.
      ATOMIC_USAGE_TEST_DATABASE_URL: postgres://postgres:disposable-test-password@127.0.0.1:5432/runvara_atomic_usage_test
      ATOMIC_USAGE_ALLOW_DISPOSABLE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: saas/server/tests/atomic-usage/package-lock.json
      - name: Allow 100 simultaneous independent database sessions
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -d runvara_atomic_usage_test \
            -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_connections = '160';"
          docker restart "$POSTGRES_CONTAINER_ID"
          for attempt in {1..30}; do
            if docker exec "$POSTGRES_CONTAINER_ID" pg_isready -U postgres -d runvara_atomic_usage_test; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Install locked test-only PostgreSQL driver
        run: npm --prefix saas/server/tests/atomic-usage ci --ignore-scripts --no-audit --no-fund
      - name: Verify pinned local PostgREST for HTTP timeout qualification
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$RUNNER_TEMP/runvara-atomic-postgrest"
          mkdir -p "$test_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 60 \
            --output "$test_dir/postgrest.tar.xz" \
            https://github.com/PostgREST/postgrest/releases/download/v14.5/postgrest-v14.5-linux-static-x86-64.tar.xz
          echo 'ab5cc7e974d4940447991804588cfb8b3f7b2c57b691f0905df04d51ede69470  '"$test_dir/postgrest.tar.xz" | sha256sum --check --strict
          test "$(tar -tJf "$test_dir/postgrest.tar.xz")" = postgrest
          tar -xJf "$test_dir/postgrest.tar.xz" --directory "$test_dir" --no-same-owner --no-same-permissions postgrest
          echo '39ce04b0597c6b3c3eb4c5f34fe6ab590a2d0172616eeaccf1e4c659b822295a  '"$test_dir/postgrest" | sha256sum --check --strict
          chmod 700 "$test_dir/postgrest"
          test "$("$test_dir/postgrest" --version)" = 'PostgREST 14.5'
      - name: Run real PostgreSQL admission, settlement, and privilege tests
        env:
          ATOMIC_USAGE_POSTGREST_BIN: ${{ runner.temp }}/runvara-atomic-postgrest/postgrest
        run: npm --prefix saas/server/tests/atomic-usage test
      - name: Verify automation archive PostgreSQL roundtrip bounds
        run: node --test --test-concurrency=1 saas/server/tests/automation-retention-postgres.mjs
