name: Reporting status CAS PostgreSQL

on:
  pull_request:
    paths:
      - 'saas/server/**'
      - '.github/workflows/reporting-status-check.yml'
  push:
    paths:
      - 'saas/server/**'
      - '.github/workflows/reporting-status-check.yml'

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: runvara_reporting_status_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runvara_reporting_status_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REPORTING_STATUS_TEST_DATABASE_URL: postgres://postgres:disposable-test-password@127.0.0.1:5432/runvara_reporting_status_test
      REPORTING_STATUS_ALLOW_DISPOSABLE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: saas/server/tests/atomic-usage/package-lock.json
      - name: Install locked test-only PostgreSQL driver
        run: npm --prefix saas/server/tests/atomic-usage ci --ignore-scripts --no-audit --no-fund
      - name: Verify bounded wire bodies, failure handling, and original store invariants
        run: node --test saas/server/tests/reporting-status-store.test.mjs saas/server/tests/store-supabase.test.mjs saas/server/tests/automation-retention-store.test.mjs
      - name: Verify real PostgreSQL concurrency, tenant boundaries, grants, and exact updates
        run: node --test --test-concurrency=1 saas/server/tests/reporting-status-postgres.mjs
