plugins {
    id 'com.android.application'
}

android {
    namespace 'com.packsmartsolutions.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.packsmartsolutions.app'
        minSdk 26
        targetSdk 36
        versionCode 20
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            // Use a unique package for sideload testing so it can install
            // alongside any existing Packsmart Play/debug build.
            applicationIdSuffix '.multiphoto'
            versionNameSuffix '-multiphoto'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
