plugins {
    id 'com.android.application'
}

android {
    namespace 'com.packsmartsolutions.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.packsmartsolutions.app'
        minSdk 26
        targetSdk 36
        versionCode 101
        versionName '2.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            // Keep the sideload test build separate from the Play-installed app
            // so both can be installed on the same phone during QA.
            applicationIdSuffix '.multiphoto'
            versionNameSuffix '-multiphoto'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
