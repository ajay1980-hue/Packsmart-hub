plugins {
    id 'com.android.application'
}

def debugSigningProps = new Properties()
def debugSigningPropsFile = file('debug-signing.properties')
if (debugSigningPropsFile.exists()) {
    debugSigningPropsFile.withInputStream { debugSigningProps.load(it) }
}

android {
    namespace 'com.packsmartsolutions.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.packsmartsolutions.app'
        minSdk 26
        targetSdk 36
        versionCode 20
        versionName '2.0.0'
    }

    signingConfigs {
        debug {
            storeFile file(debugSigningProps['storeFile'])
            storePassword debugSigningProps['storePassword']
            keyAlias debugSigningProps['keyAlias']
            keyPassword debugSigningProps['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
