plugins {
    id 'com.android.application'
}

android {
    namespace 'com.packsmartsolutions.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.packsmartsolutions.app'
        minSdk 26
        targetSdk 36
        versionCode 100
        versionName '2.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
